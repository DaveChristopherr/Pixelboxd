<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 110" width="540" height="110">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
      .pixel-title {
        font-family: 'Press Start 2P', monospace, sans-serif;
        font-size: 34px;
        fill: #ffffff;
        letter-spacing: 2px;
      }
      .pixel-sub {
        font-family: 'Press Start 2P', monospace, sans-serif;
        font-size: 11px;
        fill: #00e461;
        letter-spacing: 1px;
      }
    </style>
  </defs>
  
  <!-- Background Card -->
  <rect x="2" y="2" width="536" height="106" fill="#141820" stroke="#263141" stroke-width="3" rx="0"/>
  
  <!-- Retro Letterboxd Pixel Dots -->
  <g transform="translate(24, 28)">
    <rect x="0" y="8" width="22" height="22" fill="#ff8000" stroke="#101319" stroke-width="2"/>
    <rect x="18" y="8" width="22" height="22" fill="#00e461" stroke="#101319" stroke-width="2"/>
    <rect x="36" y="8" width="22" height="22" fill="#00b4fc" stroke="#101319" stroke-width="2"/>
    <!-- Highlight pixels -->
    <rect x="3" y="11" width="5" height="5" fill="#ffa64d"/>
    <rect x="21" y="11" width="5" height="5" fill="#47ff96"/>
    <rect x="39" y="11" width="5" height="5" fill="#66d1ff"/>
  </g>
  
  <!-- Pixel Title Text -->
  <text x="100" y="58" class="pixel-title">PIXEBOXD</text>
  <text x="102" y="84" class="pixel-sub">RETRO LETTERBOXD POSTER GAME</text>
</svg>
